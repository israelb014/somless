name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/somless-pwa-app-qal8ry
  workflow_dispatch:

# הפרסום נעשה בדחיפה לענף gh-pages, ולא דרך ה-Pages API —
# ה-GITHUB_TOKEN של Actions לא מורשה ליצור אתר Pages בריפו הזה.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # האתר מתארח תחת /<שם-הריפו>/ — ה-base חייב להתאים
      - name: Build
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
