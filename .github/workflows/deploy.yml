name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/somless-pwa-app-qal8ry
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פריסה אחת בכל רגע נתון; ריצה חדשה לא מבטלת פריסה שכבר רצה
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # enablement: true מפעיל את GitHub Pages בריפו אם הוא עדיין לא מופעל
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # base_path מגיע מ-configure-pages (למשל /somless/) כדי שהנכסים ייטענו
      # נכון גם תחת תת-נתיב
      - name: Build
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
